<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak | Arnoldus Zebua</title>
    <meta name="description" content="Hubungi Arnoldus Zebua - IT Engineer. Form kontak langsung ke email.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0a0c15;
            color: #eef2ff;
            min-height: 100vh;
            transition: all 0.4s ease;
        }

        body.light-mode {
            background: #f1f5f9;
            color: #0f172a;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
        }

        .floating-socials {
            position: fixed;
            right: 24px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 99;
        }

        .floating-socials a {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            text-decoration: none;
            transition: all 0.3s ease;
            animation: floatUp 0.6s ease both;
            color: #94a3b8;
        }

        body.light-mode .floating-socials a {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.08);
            color: #475569;
        }

        .floating-socials a:nth-child(1) { animation-delay: 0.1s; }
        .floating-socials a:nth-child(2) { animation-delay: 0.2s; }
        .floating-socials a:nth-child(3) { animation-delay: 0.3s; }

        .floating-socials a:hover {
            transform: scale(1.15) translateY(-5px);
            background: #3b82f6;
            color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        body.light-mode nav {
            background: rgba(255, 255, 255, 0.7);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .nav-logo {
            font-size: 1.6em;
            font-weight: 700;
            color: #3b82f6;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #cbd5e1;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s ease;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
        }

        body.light-mode .nav-links a {
            color: #475569;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #3b82f6;
            border-bottom-color: #3b82f6;
        }

        .theme-toggle {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            background: rgba(59, 130, 246, 0.2);
            transform: scale(1.05);
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px 24px;
        }

        .page-header {
            padding: 40px 20px 20px;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-header h2 {
            font-size: 2em;
            color: #ffffff;
            border-left: 4px solid #3b82f6;
            padding-left: 16px;
            font-weight: 700;
        }

        body.light-mode .page-header h2 {
            color: #0f172a;
        }

        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }

        .contact-link-card {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease both;
        }

        body.light-mode .contact-link-card {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(0, 0, 0, 0.05);
        }

        .contact-link-card:hover {
            border-color: rgba(59, 130, 246, 0.3);
            transform: translateX(5px);
        }

        .contact-icon {
            font-size: 28px;
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-wa { background: rgba(37, 211, 102, 0.15); }
        .icon-ig { background: rgba(225, 48, 108, 0.15); }
        .icon-gh { background: rgba(255, 255, 255, 0.08); }

        .contact-info h4 {
            color: #f1f5f9;
            font-size: 1em;
            margin-bottom: 4px;
        }

        body.light-mode .contact-info h4 {
            color: #0f172a;
        }

        .contact-info p {
            color: #94a3b8;
            font-size: 0.85em;
        }

        body.light-mode .contact-info p {
            color: #475569;
        }

        .form-card {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 28px;
            transition: all 0.4s ease;
            animation: fadeInUp 0.6s ease 0.2s both;
        }

        body.light-mode .form-card {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(0, 0, 0, 0.05);
        }

        .form-card h3 {
            color: #f1f5f9;
            font-size: 1.2em;
            margin-bottom: 20px;
            border-left: 4px solid #3b82f6;
            padding-left: 14px;
            font-weight: 600;
        }

        body.light-mode .form-card h3 {
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: #94a3b8;
            font-size: 0.85em;
            margin-bottom: 6px;
            font-weight: 500;
        }

        body.light-mode .form-group label {
            color: #475569;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #e2e8f0;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        body.light-mode .form-group input, body.light-mode .form-group textarea {
            background: white;
            border-color: #cbd5e1;
            color: #0f172a;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }

        .submit-btn:disabled {
            background: #64748b;
            cursor: not-allowed;
            transform: none;
        }

        .form-message {
            text-align: center;
            margin-top: 12px;
            font-weight: 500;
            font-size: 13px;
            display: none;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            nav { padding: 14px 20px; }
            .nav-links { gap: 16px; }
            .page-header h2 { font-size: 1.6em; }
            .container { padding: 16px; }
            .form-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="floating-socials">
        <a href="https://instagram.com/arnoldfzebua" target="_blank">📸</a>
        <a href="https://github.com/arnoldf-ai" target="_blank">🐱</a>
        <a href="https://wa.me/6285246843647" target="_blank">💬</a>
    </div>

    <div class="content-wrapper">
        <nav>
            <a href="index.html" class="nav-logo">AZ</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="skill.html">Skill</a>
                <a href="projek.html">Projek</a>
                <a href="kontak.html" class="active">Kontak</a>
                <a href="microtools.html">MicroTools</a>
                <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️</button>
            </div>
        </nav>

        <div class="container">
            <div class="page-header">
                <h2>📞 Kontak</h2>
            </div>

            <div class="contact-links">
                <a href="https://wa.me/6285246843647" class="contact-link-card" style="animation-delay:0.1s;">
                    <div class="contact-icon icon-wa">💬</div>
                    <div class="contact-info">
                        <h4>WhatsApp</h4>
                        <p>0852-4684-3647</p>
                    </div>
                </a>
                <a href="https://instagram.com/arnoldfzebua" class="contact-link-card" style="animation-delay:0.15s;">
                    <div class="contact-icon icon-ig">📸</div>
                    <div class="contact-info">
                        <h4>Instagram</h4>
                        <p>@arnoldfzebua</p>
                    </div>
                </a>
                <a href="https://github.com/arnoldf-ai" class="contact-link-card" style="animation-delay:0.2s;">
                    <div class="contact-icon icon-gh">🐱</div>
                    <div class="contact-info">
                        <h4>GitHub</h4>
                        <p>github.com/arnoldf-ai</p>
                    </div>
                </a>
            </div>

            <div class="form-card">
                <h3>📩 Kirim Pesan Langsung</h3>
                <form id="contactForm" action="https://formspree.io/f/xkoyjbvr" method="POST">
                    <div class="form-group">
                        <label for="name">Nama</label>
                        <input type="text" id="name" name="name" placeholder="Nama kamu" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="email@kamu.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Pesan</label>
                        <textarea id="message" name="message" placeholder="Tulis pesan kamu di sini..." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn">🚀 KIRIM PESAN</button>
                    <p class="form-message" id="formMessage"></p>
                </form>
            </div>
        </div>

        <footer>© 2026 Arnoldus Fahuwusa Zebua — Dibangun dengan ❤️ dari Android</footer>
    </div>

    <script>
        const body = document.body;
        const themeBtn = document.getElementById('themeBtn');
        
        function setTheme(mode) {
            if (mode === 'light') {
                body.classList.add('light-mode');
                themeBtn.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                body.classList.remove('light-mode');
                themeBtn.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            }
        }
        
        function toggleTheme() {
            body.classList.contains('light-mode') ? setTheme('dark') : setTheme('light');
        }
        
        (function() {
            const saved = localStorage.getItem('theme');
            saved === 'light' ? setTheme('light') : setTheme('dark');
        })();

        // Contact Form
        const form = document.getElementById('contactForm');
        const msg = document.getElementById('formMessage');
        const btn = document.getElementById('submitBtn');
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = '⏳ MENGIRIM...';
            msg.style.display = 'none';
            try {
                const res = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                });
                if (res.ok) {
                    msg.textContent = '✅ Pesan terkirim! Aku akan balas secepatnya.';
                    msg.style.color = '#3b82f6';
                    form.reset();
                } else {
                    throw new Error('Gagal');
                }
            } catch (err) {
                msg.textContent = '❌ Gagal kirim. Coba lagi atau hubungi via WhatsApp.';
                msg.style.color = '#ef4444';
            }
            msg.style.display = 'block';
            btn.disabled = false;
            btn.textContent = '🚀 KIRIM PESAN';
        });
    </script>
</body>
</html>
